<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures the app scales correctly on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIIT Timer</title>
    
    <!-- Link to the PWA manifest for offline installation -->
    <link rel="manifest" href="./manifest.json">
    
    <script>
        // Register the Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>

    <style>
        /* Base styling for the entire app */
        body {
            margin: 0 auto; /* Centers the app horizontally on desktop */
            max-width: 500px; /* Constrains the width to a mobile size */
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            text-transform: uppercase;
        }

        /* The Setup screen where you configure your workout */
        #setup-screen {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Styling for the input fields to make them large and touch-friendly */
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
        }
        input {
            width: 80px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }

        /* The main Start button styling */
        button {
            background-color: #FFFF00; /* Bright yellow */
            color: black;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* The Timer screen (hidden by default until Start is pressed) */
        #timer-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        /* Top bar showing total remaining time or current status */
        #top-bar {
            text-align: center;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
        }

        /* The main display area that changes color (Yellow=Prepare, Green=Work, Red=Rest) */
        #main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FFFF00; /* Defaults to Prepare Yellow */
            color: black;
            transition: background-color 0.3s;
        }

        /* The large countdown numbers */
        #time-display {
            font-size: 8rem;
            font-weight: bold;
            line-height: 1;
            margin: 0;
        }

        /* Text label above the time (e.g., "PREPARE", "WORK") */
        #phase-label {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: -10px;
        }

        /* Bottom section showing rounds left and a stop button */
        #bottom-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background-color: #222;
        }
        
        .rounds-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #rounds-display {
            color: #33B5E5; /* Bright blue for contrast */
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
        }

        /* Stop button styled to look like the pause/stop control */
        #stop-btn {
            background: none;
            border: 4px solid #FFFF00;
            color: #FFFF00;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 1.2rem;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h2>HIIT Configuration</h2>
        
        <div class="input-group">
            <label>Rounds (1-50):</label>
            <input type="number" id="input-rounds" value="10" min="1" max="50">
        </div>
        
        <div class="input-group">
            <label>Work (seconds):</label>
            <input type="number" id="input-work" value="40" min="5" max="300">
        </div>
        
        <div class="input-group">
            <label>Rest (seconds):</label>
            <input type="number" id="input-rest" value="20" min="5" max="300">
        </div>

        <p id="total-time-estimate">Total Time: 10m 00s</p>
        
        <button onclick="startWorkout()">START</button>
    </div>

    <!-- TIMER SCREEN -->
    <div id="timer-screen">
        <div id="top-bar">
            ROUNDS<br><span id="total-time-left">00:00</span>
        </div>
        
        <div id="main-display">
            <div id="phase-label">PREPARE</div>
            <div id="time-display">00:05</div>
        </div>
        
        <div id="bottom-bar">
            <div class="rounds-info">
                <div id="rounds-display">10</div>
                <div style="font-size: 0.8rem;">ROUNDS LEFT</div>
            </div>
            <button id="stop-btn" onclick="stopWorkout()">STOP</button>
        </div>
    </div>

    <script>
        // --- Variables to hold workout state ---
        let timerInterval;     
        let currentPhase = 'prepare'; 
        let timeLeft = 0;      
        let currentRound = 0;  
        let totalRounds, workTime, restTime;

        // --- Audio System (Polly MP3 Files) ---
        const audioFiles = {
            "Get ready": new Audio('./get-ready.mp3'),
            "3": new Audio('./3.mp3'),
            "2": new Audio('./2.mp3'),
            "1": new Audio('./1.mp3'),
            "Half way": new Audio('./half-way.mp3'),
            "Work": new Audio('./work.mp3'),
            "Rest": new Audio('./rest.mp3'),
            "Workout complete. Well done.": new Audio('./complete.mp3')
        };

        function speak(text) {
            if (audioFiles[text]) {
                // Reset the audio to start in case it's already playing
                audioFiles[text].currentTime = 0; 
                audioFiles[text].play().catch(e => console.log("Audio play blocked by browser:", e));
            }
        }

        // --- Estimate Total Time ---
        function updateEstimate() {
            const r = parseInt(document.getElementById('input-rounds').value) || 0;
            const w = parseInt(document.getElementById('input-work').value) || 0;
            const rest = parseInt(document.getElementById('input-rest').value) || 0;
            
            const totalSeconds = 5 + (w * r) + (rest * (r - 1));
            
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('total-time-estimate').innerText = `Total Time: ${mins}m ${secs}s`;
        }

        document.getElementById('input-rounds').addEventListener('input', updateEstimate);
        document.getElementById('input-work').addEventListener('input', updateEstimate);
        document.getElementById('input-rest').addEventListener('input', updateEstimate);
        updateEstimate(); 

        // --- Formatting Helper ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- Core Timer Logic ---
        function startWorkout() {
            totalRounds = parseInt(document.getElementById('input-rounds').value);
            workTime = parseInt(document.getElementById('input-work').value);
            restTime = parseInt(document.getElementById('input-rest').value);
            
            currentRound = totalRounds;
            currentPhase = 'prepare';
            timeLeft = 5; 
            
            // Trigger first audio cue (also unlocks browser audio limits)
            speak("Get ready");

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            
            updateDisplay();
            
            timerInterval = setInterval(tick, 1000);
        }

        function tick() {
            timeLeft--; 

            if (timeLeft === 3) speak("3");
            if (timeLeft === 2) speak("2");
            if (timeLeft === 1) speak("1");

            if (currentPhase === 'work' && timeLeft === Math.floor(workTime / 2)) {
                speak("Half way");
            }

            if (timeLeft <= 0) {
                if (currentPhase === 'prepare') {
                    currentPhase = 'work';
                    timeLeft = workTime;
                    speak("Work");
                } 
                else if (currentPhase === 'work') {
                    currentRound--; 
                    
                    if (currentRound > 0) {
                        currentPhase = 'rest';
                        timeLeft = restTime;
                        speak("Rest");
                    } else {
                        finishWorkout();
                        return; 
                    }
                } 
                else if (currentPhase === 'rest') {
                    currentPhase = 'work';
                    timeLeft = workTime;
                    speak("Work");
                }
            }

            updateDisplay();
        }

        // --- UI Updater ---
        function updateDisplay() {
            const mainDisplay = document.getElementById('main-display');
            const phaseLabel = document.getElementById('phase-label');
            const timeDisplay = document.getElementById('time-display');
            const roundsDisplay = document.getElementById('rounds-display');

            timeDisplay.innerText = formatTime(timeLeft);
            roundsDisplay.innerText = currentRound;
            phaseLabel.innerText = currentPhase.toUpperCase();

            if (currentPhase === 'prepare') {
                mainDisplay.style.backgroundColor = '#FFFF00'; 
                mainDisplay.style.color = 'black';
            } else if (currentPhase === 'work') {
                mainDisplay.style.backgroundColor = '#99FF33'; 
                mainDisplay.style.color = 'black';
            } else if (currentPhase === 'rest') {
                mainDisplay.style.backgroundColor = '#FF3333'; 
                mainDisplay.style.color = 'white';
            }
        }

        // --- Stop / Finish Functions ---
        function stopWorkout() {
            clearInterval(timerInterval); 
            document.getElementById('setup-screen').style.display = 'flex';
            document.getElementById('timer-screen').style.display = 'none';
        }

        function finishWorkout() {
            clearInterval(timerInterval);
            speak("Workout complete. Well done.");
            
            document.getElementById('phase-label').innerText = "DONE";
            document.getElementById('time-display').innerText = "00:00";
            document.getElementById('main-display').style.backgroundColor = '#33B5E5'; 
            
            setTimeout(() => {
                stopWorkout();
            }, 3000);
        }
    </script>
</body>
</html>
